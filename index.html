const categories=['سوبر ماركت','صيدليات','مطاعم','خضراوات وفاكهة','لحوم ودواجن وأسماك','مخابز وحلويات','محلات متنوعة','ورش وصيانة'];
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function item(ic,t,d,target){return `<button class="menu-card" onclick="showPage('${target}')"><span class="menu-ico">${ic}</span><span>${t}<small>${d}</small></span><span class="arrow">‹</span></button>`}
function setRole(r){role=r;localStorage.setItem('etlobly_role',r);document.getElementById('welcomeScreen').hidden=true;document.getElementById('app').style.visibility='visible';const customerNav=document.getElementById('customerNav'),courierNav=document.getElementById('courierNav');customerNav.hidden=r!=='عميل';courierNav.hidden=r!=='مندوب';customerNav.style.visibility=r==='عميل'?'visible':'hidden';courierNav.style.visibility=r==='مندوب'?'visible':'hidden';sub.hidden=true;home.hidden=r!=='عميل';courierHome.hidden=r!=='مندوب';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page==='الرئيسية'));window.scrollTo(0,0)}
function showPage(name){if(name==='إدارة الأماكن'&&role!=='إدارة'){notify('هذا القسم مخصص للإدارة فقط');return}if(name==='الرئيسية'){sub.hidden=true;home.hidden=role!=='عميل';courierHome.hidden=role!=='مندوب';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page==='الرئيسية'));window.scrollTo({top:0,behavior:'smooth'});return}home.hidden=true;courierHome.hidden=true;sub.hidden=false;document.getElementById('pageTitle').textContent=name;document.getElementById('pageContent').innerHTML=pageData(name);document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.page===name||(role==='مندوب'&&name==='طلبات المندوب'&&n.dataset.page==='طلبات المندوب')));window.scrollTo({top:0,behavior:'smooth'})}
function storesFor(cat){return places.filter(p=>p.category===cat)}
function storeList(cat){let list=storesFor(cat);return `<div class="panel"><h3>${esc(cat)}</h3><p class="muted">الأماكن المتاحة في الدليل</p></div>${list.length?list.map(p=>`<div class="store-card"><div class="store-icon">${p.icon||'🏬'}</div><div><h3>${esc(p.name)}</h3><p>${esc(p.address||'العنوان غير محدد')}</p><p>${p.lat&&p.lng?'موقع محدد على الخريطة':'الموقع يحتاج استكمال'}</p>${p.map?`<a href="${esc(p.map)}" target="_blank" rel="noopener" style="font-size:11px;color:#0785c8">فتح الموقع</a>`:(p.lat&&p.lng?`<a href="https://www.google.com/maps?q=${encodeURIComponent(p.lat+','+p.lng)}" target="_blank" rel="noopener" style="font-size:11px;color:#0785c8">فتح الموقع على الخريطة</a>`:'')}</div><button class="primary" onclick="notify('تم اختيار المكان')">اختيار</button></div>`).join(''):`<div class="panel"><p class="muted">لا توجد أماكن مضافة لهذا القسم حتى الآن.</p></div>`}`}
function complaintsIcon(){return `<svg viewBox="0 0 48 48" width="25" height="25" aria-hidden="true"><rect x="7" y="9" width="34" height="30" rx="4" fill="none" stroke="currentColor" stroke-width="3"/><path d="M9 18L24 8L39 18" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round"/><circle cx="24" cy="32" r="2" fill="currentColor"/></svg>`}
function logoutCard(){return `<button class="menu-card" onclick="logout()"><span class="menu-ico">↪</span><span>تسجيل الخروج<small>الخروج من الحساب الحالي</small></span><span class="arrow">‹</span></button>`}
function pageData(n){if(categories.includes(n))return storeList(n);switch(n){
case 'الدليل':return `<div class="panel"><h3>دليل الأماكن</h3><p class="muted">اختار النشاط لعرض الأماكن المتاحة.</p></div>`+categories.map(c=>item(c==='صيدليات'?'💊':c==='سوبر ماركت'?'🛒':'🏬',c,'عرض الأماكن المتاحة',c)).join('');
case 'الأقسام الرئيسية':return categories.map(c=>item('🏬',c,'عرض الأماكن المتاحة',c)).join('');
case 'حسابي':return `<div class="panel" style="text-align:center"><div class="avatar placeholder" style="margin:auto;width:68px;height:68px"><svg viewBox="0 0 48 48"><circle cx="24" cy="15" r="9" fill="#687b8c"/><path d="M7 43c1-11 7-17 17-17s16 6 17 17" fill="#687b8c"/></svg></div><h3>حساب العميل</h3><p class="muted">بياناتك الشخصية وإعدادات الحساب</p></div>${item('👤','البيانات الشخصية','عرض بيانات الحساب','البيانات الشخصية')}${item('💳','المحفظة والمدفوعات','وسائل الدفع وسجل المعاملات','المحفظة والمدفوعات')}${item('❤️','المفضلة','الأماكن والمنتجات المحفوظة','المفضلة')}${logoutCard()}`;
case 'حساب المندوب':return `<div class="panel"><h3>حساب المندوب</h3><p class="muted">البيانات الشخصية والمركبة والمستندات</p></div>${item('👤','البيانات الشخصية','عرض بيانات المندوب','البيانات الشخصية')}${item('🛵','مركباتي','عرض وإدارة المركبات','مركباتي')}${item('📝','طلبات تعديل البيانات','إرسال طلب مراجعة للإدارة','طلبات تعديل البيانات')}${logoutCard()}`;
case 'المزيد':return `${role==='مندوب'?item('👤','حسابي','البيانات الشخصية والمركبة','حساب المندوب'):item('👤','حسابي','بياناتك الشخصية وإعدادات الحساب','حسابي')}${item(complaintsIcon(),'الشكاوى','تقديم ومتابعة الشكاوى والطعون','الشكاوى')}${item('💡','الاقتراحات','شاركنا أفكارك ومقترحاتك','الاقتراحات')}${item('📞','التواصل مع خدمة العملاء','المساعدة والدعم','التواصل مع خدمة العملاء')}${item('⚙️','الإعدادات','إعدادات التطبيق','الإعدادات')}`;
case 'إدارة الأماكن':return `<div class="panel"><h3>إضافة مكان جديد</h3><p class="muted">أدخل بيانات المكان وحدد إحداثياته أو رابط موقعه. تُحفظ البيانات على هذا الجهاز في هذه النسخة التجريبية.</p><label>اسم المكان<input id="pName" class="field" placeholder="مثال: سوبر ماركت ..."></label><label>القسم<select id="pCat" class="field">${categories.map(c=>`<option>${c}</option>`).join('')}</select></label><label>العنوان والمنطقة<input id="pAddress" class="field" placeholder="المنطقة السكنية / الشارع"></label><label>رقم الهاتف<input id="pPhone" class="field" inputmode="tel" placeholder="رقم التواصل"></label><div class="grid2"><label>خط العرض<input id="pLat" class="field" inputmode="decimal" placeholder="30.12345"></label><label>خط الطول<input id="pLng" class="field" inputmode="decimal" placeholder="30.12345"></label></div><label>رابط الموقع على الخريطة (اختياري)<input id="pMap" class="field" placeholder="رابط مشاركة الموقع"></label><button class="primary" onclick="addPlace()">حفظ المكان</button></div><h3>الأماكن المضافة (${places.length})</h3>${places.map((p,i)=>`<div class="store-card"><div class="store-icon">${p.icon||'🏬'}</div><div><h3>${esc(p.name)}</h3><p>${esc(p.category)} · ${esc(p.address)}</p></div><button class="primary" onclick="deletePlace(${i})">حذف</button></div>`).join('')}`;
case 'الإشعارات':return `<div class="panel"><h3>الإشعارات والتنبيهات</h3><p class="muted">تحديثات الطلبات والتعليمات والعروض الموجهة للعملاء أو المندوبين.</p></div>${item('📣','تعليمات مهمة','تحديثات وإرشادات التشغيل','التعليمات')}${item('🎁','العروض والمكافآت','عروض وحوافز','العروض')}`;
case 'الإعدادات':return settingsPage();
case 'طلباتي':case 'طلبات المندوب':return `<div class="panel"><h3>الطلبات الجارية</h3><p class="muted">كل طلب تم قبوله يظل هنا حتى تسليمه وإغلاقه.</p><span class="status">${activeOrders.length} طلب جارٍ</span></div>${activeOrders.length?activeOrders.map((o,i)=>`<div class="panel"><h3>${esc(o.title||'طلب توصيل')}</h3><p class="muted">${esc(o.from||'مكان الشراء')} ← ${esc(o.to||'عنوان العميل')}</p><span class="status">${esc(o.status||'قيد التنفيذ')}</span><p class="muted">رقم الطلب: ${esc(o.id||i+1)}</p></div>`).join(''):`<div class="panel" style="text-align:center"><h3>لا توجد طلبات جارية</h3><p class="muted">ستظهر هنا الطلبات المقبولة حتى يتم تسليمها وإغلاقها.</p></div>`}<div class="panel"><h3>الطلبات السابقة</h3><p class="muted">ستظهر هنا الطلبات التي تم تسليمها وإغلاقها.</p></div>`;
case 'الشكاوى':return `${item(complaintsIcon(),'تقديم شكوى','إرسال شكوى جديدة','تقديم شكوى')}${item('⚖️','الطعن في شكوى','اعتراض على شكوى مسجلة','الطعن في شكوى')}${item('📂','متابعة الشكاوى والطعون','متابعة الحالة والتحديثات','متابعة الشكاوى')}`;
case 'المحفظة والمدفوعات':return `<div class="panel"><div class="muted">رصيد المحفظة</div><h2 style="color:var(--sky)">0.00 ج.م</h2></div>`;
case 'المفضلة':return `<div class="panel"><h3>المفضلة</h3><p class="muted">الأماكن والمنتجات التي تحفظها ستظهر هنا.</p></div>`;
case 'تبديل الواجهة':return `<div class="panel"><h3>اختار الواجهة</h3><button class="primary" onclick="setRole('عميل')">واجهة العميل</button> <button class="primary" onclick="setRole('مندوب')">واجهة المندوب</button></div>`;
case 'أرباحي':return `<div class="sectionhead">ملخص نشاطك</div><div class="grid2"><div class="panel"><div class="muted">طلبات اليوم</div><h2 style="margin:5px 0;color:var(--sky)">0</h2></div><div class="panel"><div class="muted">أرباح اليوم</div><h2 style="margin:5px 0;color:var(--orange)">0 ج.م</h2></div></div><div class="panel"><h3>صافي الأرباح</h3><p class="muted">إجمالي أجور التوصيل بعد خصم عمولة التطبيق وأي مستحقات أخرى.</p><h2 style="color:var(--orange);margin:4px 0">0.00 ج.م</h2></div>`;
case 'الخصوصية والأمان':return `<div class="panel"><h3>الخصوصية والأمان</h3><p class="muted">تُستخدم بيانات الحساب والموقع لتشغيل خدمات الطلب والتوصيل، ولا يمكن تغيير البيانات الحساسة إلا من خلال إجراءات مراجعة الحساب.</p></div>`;
case 'الشروط والأحكام':return `<div class="panel"><h3>الشروط والأحكام</h3><p class="muted">ستظهر هنا الشروط المعتمدة قبل الإطلاق الرسمي.</p></div>`;
case 'عن التطبيق':return `<div class="panel" style="text-align:center"><div class="brand" style="justify-content:center"><span class="first">اطلب</span><span class="last">لى</span></div><h3>اطلبلى</h3><p class="muted">نسخة تجريبية لواجهة التطبيق.</p><span class="status">نسخة المعاينة</span></div>`;
case 'مركباتي':return `<div class="panel"><h3>المركبات</h3><p class="muted">إدارة المركبات ومستنداتها وطلبات الإضافة أو التعديل.</p><button class="primary" onclick="notify('تم فتح طلب إضافة مركبة')">طلب إضافة مركبة</button></div>`;
default:return `<div class="panel"><h3>${esc(n)}</h3><p class="muted">القسم جاهز لاستكمال تفاصيله وربطه بالخدمات.</p></div>`}}
function readSettings(){try{return JSON.parse(localStorage.getItem('etlobly_settings')||'{}')}catch(e){return {}}}
function saveSetting(key,value){const st=readSettings();st[key]=value;localStorage.setItem('etlobly_settings',JSON.stringify(st));if(key==='darkMode')document.body.classList.toggle('darkMode',!!value);notify('تم حفظ الإعداد')}
function settingToggle(key,label,desc,icon,defaultValue=false){const st=readSettings(),on=st[key]===undefined?defaultValue:!!st[key];return `<div class="settingRow"><span class="settingIcon">${icon}</span><span class="settingCopy"><strong>${label}</strong><small>${desc}</small></span><button class="switch ${on?'on':''}" role="switch" aria-checked="${on}" aria-label="${label}" onclick="toggleSetting('${key}',this)"></button></div>`}
function toggleSetting(key,el){const next=!el.classList.contains('on');saveSetting(key,next);el.classList.toggle('on',next);el.setAttribute('aria-checked',String(next))}
function settingsPage(){const st=readSettings(),lang=st.language||'العربية';return `<div class="settingsHero"><h3>إعدادات التطبيق</h3><p>تحكم في تجربتك وإشعاراتك وطريقة عرض التطبيق.</p></div><div class="settingsGroupTitle">الإشعارات والتنبيهات</div>${settingToggle('orderAlerts','تحديثات الطلبات','تنبيهات قبول الطلب وتغيير الحالة والتسليم.','🔔',true)}${settingToggle('offersAlerts','العروض والمكافآت','العروض والتنبيهات الترويجية والمكافآت.','🎁',true)}${settingToggle('guidanceAlerts','التعليمات المهمة','رسائل الإدارة والتنبيهات التشغيلية.','📣',true)}<div class="settingsGroupTitle">تفضيلات التطبيق</div>${settingToggle('locationAccess','السماح باستخدام الموقع','استخدام موقعك عند الحاجة لتحديد المتاجر والمسارات.','📍',true)}${settingToggle('darkMode','الوضع الداكن','تغيير ألوان التطبيق إلى الوضع الداكن على هذا الجهاز.','🌙',false)}<div class="settingRow"><span class="settingIcon">🌐</span><span class="settingCopy"><strong>لغة التطبيق</strong><small>لغة عرض القوائم والتنبيهات. لغات إضافية قريبًا.</small></span><span class="status">العربية</span></div><div class="settingsGroupTitle">المعلومات والسياسات</div>${item('🔒','الخصوصية والأمان','كيفية حماية بيانات الحساب واستخدامها','الخصوصية والأمان')}${item('📄','الشروط والأحكام','قواعد استخدام التطبيق','الشروط والأحكام')}${item('ℹ️','عن التطبيق','معلومات الإصدار ووسائل التواصل','عن التطبيق')}<div class="settingsFoot">تُحفظ اختياراتك على هذا الجهاز في النسخة التجريبية. مفاتيح الإشعارات تحفظ تفضيلاتك فقط، أما الإشعارات الفعلية وصلاحية الموقع فتحتاجان ربط التطبيق بخدمات الهاتف والخادم.</div>`}
function addPlace(){let name=document.getElementById('pName').value.trim(),category=document.getElementById('pCat').value,address=document.getElementById('pAddress').value.trim(),lat=document.getElementById('pLat').value.trim(),lng=document.getElementById('pLng').value.trim();if(!name){notify('اكتب اسم المكان أولًا');return}if((lat&&!lng)||(!lat&&lng)){notify('أدخل خط العرض والطول معًا');return}places.push({name,category,address,phone:document.getElementById('pPhone').value.trim(),lat,lng,map:document.getElementById('pMap').value.trim(),icon:category==='صيدليات'?'💊':category==='سوبر ماركت'?'🛒':'🏬'});localStorage.setItem('etlobly_places',JSON.stringify(places));showPage('إدارة الأماكن');notify('تم حفظ المكان')}
function deletePlace(i){places.splice(i,1);localStorage.setItem('etlobly_places',JSON.stringify(places));showPage('إدارة الأماكن')}
function searchStores(q){let found=places.filter(p=>(p.name+' '+p.category+' '+p.address).includes(q));home.hidden=true;sub.hidden=false;document.getElementById('pageTitle').textContent='نتائج البحث';document.getElementById('pageContent').innerHTML=found.length?found.map(p=>`<div class="store-card"><div class="store-icon">${p.icon||'🏬'}</div><div><h3>${esc(p.name)}</h3><p>${esc(p.category)} · ${esc(p.address)}</p></div></div>`).join(''):'<div class="panel"><p class="muted">لا توجد نتائج مطابقة.</p></div>'}
function logout(){localStorage.removeItem('etlobly_role');role='عميل';document.getElementById('app').style.visibility='hidden';document.getElementById('customerNav').hidden=true;document.getElementById('courierNav').hidden=true;document.getElementById('customerNav').style.visibility='hidden';document.getElementById('courierNav').style.visibility='hidden';document.getElementById('welcomeScreen').hidden=false;window.scrollTo(0,0)}
function refreshCurrent(){activeOrders=JSON.parse(localStorage.getItem('etlobly_active_orders')||'[]');places=JSON.parse(localStorage.getItem('etlobly_places')||'[]');if(!sub.hidden){let title=document.getElementById('pageTitle').textContent;document.getElementById('pageContent').innerHTML=pageData(title)}notify('تم تحديث الطلبات والبيانات')}
let touchStartY=0;window.addEventListener('touchstart',e=>{if(window.scrollY===0)touchStartY=e.touches[0].clientY},{passive:true});window.addEventListener('touchend',e=>{let dy=e.changedTouches[0].clientY-touchStartY;if(touchStartY&&dy>95&&window.scrollY===0){refreshCurrent()}touchStartY=0},{passive:true});
function notify(t){let x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window._toastTimer);window._toastTimer=setTimeout(()=>x.classList.remove('show'),2200)}
// استعادة نوع الحساب تلقائيًا بعد أول اختيار؛ شاشة اختيار الوجهة تظهر للمرة الأولى فقط.
(function restoreSavedRole(){
 const savedSettings=readSettings();document.body.classList.toggle('darkMode',!!savedSettings.darkMode);
 const savedRole=localStorage.getItem('etlobly_role');
 if(savedRole==='عميل'||savedRole==='مندوب') setRole(savedRole);
})();
// السحب للتحديث لا يعيد المستخدم إلى شاشة اختيار الوجهة.
</script>
<script>
/* ===== اطلبلى v2: دورة الطلب الكاملة للعميل ===== */
const CAT_ICON={'سوبر ماركت':'🛒','صيدليات':'💊','مطاعم':'🍲','خضراوات وفاكهة':'🥬','لحوم ودواجن وأسماك':'🥩','مخابز وحلويات':'🥐','محلات متنوعة':'🛍️','ورش وصيانة':'🔧'};
const DEMO_STORES={'سوبر ماركت':['ماركت الأمانة','هايبر السعادة'],'صيدليات':['صيدلية الشفاء','صيدلية النور'],'مطاعم':['مطعم الشيف','بيت الشاورما'],'خضراوات وفاكهة':['خضار الحارة','فاكهة طازة'],'لحوم ودواجن وأسماك':['جزارة البركة','أسماك المرسى'],'مخابز وحلويات':['مخبز الفرن البلدي','حلويات السلطان'],'محلات متنوعة':['محل الخير','بازار المنزل'],'ورش وصيانة':['ورشة الفنية','صيانة سريعة']};
const PRODUCTS={'سوبر ماركت':[['🥛','لبن كامل الدسم 1 لتر',38],['🍞','عيش توست',25],['🧀','جبنة رومي 250 جم',120],['🥚','بيض 30 بيضة',135],['🍚','أرز 1 كجم',42]],'صيدليات':[['💊','مسكن للألم',25],['🧴','كريم مرطب',85],['😷','كمامات (10)',20],['🩹','بلاستر طبي',15],['🧪','فيتامين سي',90]],'مطاعم':[['🍔','برجر لحم',95],['🍕','بيتزا مارجريتا',140],['🍗','فراخ مشوية',160],['🥙','شاورما فراخ',70],['🍟','بطاطس مقلية',35]],'خضراوات وفاكهة':[['🍅','طماطم 1 كجم',20],['🥒','خيار 1 كجم',18],['🍌','موز 1 كجم',45],['🍎','تفاح 1 كجم',60],['🥔','بطاطس 1 كجم',22]],'لحوم ودواجن وأسماك':[['🥩','لحم كندوز 1 كجم',380],['🍗','فراخ 1 كجم',95],['🐟','بلطي 1 كجم',85],['🦐','جمبري 1 كجم',320]],'مخابز وحلويات':[['🥐','كرواسون',20],['🍰','تورتة شوكولاتة',250],['🍪','بسكويت زبدة',40],['🍩','دونتس',25]],'محلات متنوعة':[['🔋','بطاريات AA',30],['💡','لمبة LED',55],['🧻','مناديل',25],['🧽','إسفنج جلي',15]],'ورش وصيانة':[['🔧','كشف وصيانة عامة',100],['🚰','سباكة',150],['⚡','كهربائي',150],['❄️','تنظيف تكييف',300]]};
const STEPS=[['تم استلام الطلب','المتجر استلم طلبك'],['جاري التجهيز','بيجهزوا طلبك دلوقتي'],['المندوب في الطريق','المندوب خد الطلب وجاي لك'],['تم التسليم','بالهنا والشفا 🎉']];
const FEE=15;
const sv=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const ld=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}};
let cart=ld('etlobly_cart',{sid:null,items:{}}),pay=ld('etlobly_pay','كاش'),curPage='الرئيسية';
const money=n=>n.toLocaleString('ar-EG')+' ج.م';
function storesOf(cat){const u=places.map((p,i)=>({p,i})).filter(x=>x.p.category===cat).map(x=>({id:'u'+x.i,name:x.p.name,icon:x.p.icon||CAT_ICON[cat],cat,eta:'30-40',rating:'4.5'}));return (DEMO_STORES[cat]||[]).map((n,i)=>({id:'d'+categories.indexOf(cat)+'_'+i,name:n,icon:CAT_ICON[cat],cat,eta:i?'35-45':'20-30',rating:i?'4.6':'4.8'})).concat(u)}
function findStore(id){for(const c of categories){const s=storesOf(c).find(x=>x.id===id);if(s)return s}return null}
function cartCount(){return Object.values(cart.items).reduce((a,b)=>a+b.q,0)}
function cartSub(){return Object.values(cart.items).reduce((a,b)=>a+b.q*b.price,0)}
function saveCart(){sv('etlobly_cart',cart);const b=document.getElementById('cartBadge'),n=cartCount();if(b){b.textContent=n;b.hidden=!n}}
function rerender(){document.getElementById('pageContent').innerHTML=pageData(curPage);saveCart()}
function addQ(sid,i,d){const s=findStore(sid),p=PRODUCTS[s.cat][i],k=sid+'_'+i;if(d>0&&cart.sid&&cart.sid!==sid&&cartCount()&&!confirm('سلتك فيها منتجات من متجر تاني. تفرغها وتبدأ من جديد؟'))return;if(cart.sid!==sid){cart={sid,items:{}}}const it=cart.items[k]||(cart.items[k]={q:0,icon:p[0],name:p[1],price:p[2]});it.q=Math.max(0,it.q+d);if(!it.q)delete cart.items[k];if(!cartCount())cart={sid:null,items:{}};rerender()}
function cartLineQ(k,d){const it=cart.items[k];if(!it)return;it.q+=d;if(it.q<=0)delete cart.items[k];if(!cartCount())cart={sid:null,items:{}};rerender()}
function storeCards(cat){return `<div class="sectionhead">${esc(cat)}</div>`+storesOf(cat).map(s=>`<div class="scard" onclick="showPage('متجر:${s.id}')"><div class="si">${s.icon}</div><div><h3>${esc(s.name)}</h3><small><span>⭐ ${s.rating}</span><span>🕒 ${s.eta} د</span><span>🛵 ${FEE} ج.م</span></small></div><span class="go">‹</span></div>`).join('')}
function storePage(id){const s=findStore(id);if(!s)return '<div class="panel"><h3>المتجر غير موجود</h3></div>';const n=cartCount(),inCart=cart.sid===id&&n;return `<div class="sbanner"><div class="si">${s.icon}</div><div><h2>${esc(s.name)}</h2><small><span>⭐ ${s.rating}</span><span>🕒 ${s.eta} دقيقة</span><span>🛵 توصيل ${FEE} ج.م</span></small></div></div><div class="sectionhead">المنتجات</div>`+PRODUCTS[s.cat].map((p,i)=>{const q=(cart.items[id+'_'+i]||{}).q||0;return `<div class="pcard"><div class="pi">${p[0]}</div><div><b>${esc(p[1])}</b><span class="pr">${money(p[2])}</span></div><div class="qty">${q?`<button class="m" onclick="addQ('${id}',${i},-1)">−</button><span>${q}</span>`:''}<button onclick="addQ('${id}',${i},1)">+</button></div></div>`}).join('')+(inCart?`<div style="height:70px"></div><button class="cartbar" onclick="showPage('سلة التسوق')"><span>🛒 عرض السلة (${n})</span><span>${money(cartSub())}</span></button>`:'')}
function cartPage(){const n=cartCount();if(!n)return `<div class="panel" style="text-align:center;padding:34px 16px"><div style="font-size:64px">🛒</div><h3>السلة فاضية</h3><p class="muted">اختار قسم وابدأ اطلب اللي محتاجه</p><button class="bigbtn" onclick="showPage('الأقسام الرئيسية')">تصفح الأقسام</button></div>`;const s=findStore(cart.sid),sub=cartSub();return `<div class="panel"><h3>${s?s.icon+' '+esc(s.name):'طلبك'}</h3></div>`+Object.entries(cart.items).map(([k,it])=>`<div class="pcard"><div class="pi">${it.icon}</div><div><b>${esc(it.name)}</b><span class="pr">${money(it.price*it.q)}</span></div><div class="qty"><button class="m" onclick="cartLineQ('${k}',-1)">−</button><span>${it.q}</span><button onclick="cartLineQ('${k}',1)">+</button></div></div>`).join('')+`<div class="sum"><div><span>المجموع</span><span>${money(sub)}</span></div><div><span>رسوم التوصيل</span><span>${money(FEE)}</span></div><div class="tot"><span>الإجمالي</span><span>${money(sub+FEE)}</span></div></div><div class="sum"><b>📍 عنوان التوصيل</b><input id="oAddr" class="fld" placeholder="الشارع / رقم العمارة / الدور" value="${esc(localStorage.getItem('etlobly_addr')||'')}"><input id="oNote" class="fld" placeholder="ملاحظات للمندوب (اختياري)"><b>💳 طريقة الدفع</b><div class="pay"><button class="${pay==='كاش'?'on':''}" onclick="setPay('كاش')">💵 كاش عند الاستلام</button><button class="${pay==='المحفظة'?'on':''}" onclick="setPay('المحفظة')">👛 المحفظة</button></div></div><button class="bigbtn" onclick="placeOrder()">تأكيد الطلب ✓ ${money(sub+FEE)}</button>`}
function setPay(p){pay=p;sv('etlobly_pay',p);const a=document.getElementById('oAddr').value,nt=document.getElementById('oNote').value;rerender();document.getElementById('oAddr').value=a;document.getElementById('oNote').value=nt}
function placeOrder(){const a=document.getElementById('oAddr').value.trim();if(!a){notify('اكتب عنوان التوصيل الأول');document.getElementById('oAddr').focus();return}localStorage.setItem('etlobly_addr',a);const s=findStore(cart.sid),sub=cartSub(),id='ET'+Math.floor(10000+Math.random()*89999);activeOrders.unshift({id,title:s.name,from:s.name,to:(typeof area!=='undefined'&&area?area+' — ':'')+a,stage:0,status:STEPS[0][0],total:sub+FEE,pay,note:document.getElementById('oNote').value,items:Object.values(cart.items).map(i=>({n:i.name,q:i.q,p:i.price})),t:Date.now()});sv('etlobly_active_orders',activeOrders);cart={sid:null,items:{}};saveCart();notify('تم تأكيد طلبك 🎉');showPage('تتبع:'+id)}
function trackPage(id){const o=activeOrders.find(x=>x.id===id);if(!o)return '<div class="panel"><h3>الطلب غير موجود</h3></div>';const st=o.stage||0;return `<div class="sum" style="text-align:center"><span class="chip ${st>2?'ok':''}">${esc(STEPS[st][0])}</span><h3 style="margin:8px 0 2px">طلب #${o.id}</h3><p class="muted" style="margin:0">${esc(o.from)} ← ${esc(o.to)}</p><div class="road"><i style="width:${st/3*100}%"></i><em style="right:${st/3*100}%">🛵</em></div></div><div class="sum tl">${STEPS.map((s,i)=>`<div class="st ${i<st||st===3?'done':''} ${i===st&&st<3?'now':''}"><div class="dot">${i<st||st===3?'✓':''}</div><div>${s[0]}<small>${s[1]}</small></div></div>`).join('')}</div><div class="sum">${o.items.map(i=>`<div><span>${i.q}× ${esc(i.n)}</span><span>${money(i.q*i.p)}</span></div>`).join('')}<div><span>الدفع</span><span>${esc(o.pay)}</span></div><div class="tot"><span>الإجمالي</span><span>${money(o.total)}</span></div></div>`}
function ordersPage(){const a=activeOrders.filter(o=>(o.stage||0)<3),d=activeOrders.filter(o=>(o.stage||0)>=3),card=o=>`<div class="ocard" onclick="showPage('تتبع:${o.id}')"><h3>${esc(o.title)}</h3><p class="muted" style="margin:0 0 6px">#${o.id} · ${money(o.total)}</p><span class="chip ${o.stage>2?'ok':''}">${esc(STEPS[o.stage||0][0])}</span></div>`;return `<div class="sectionhead">الطلبات الجارية (${a.length})</div>${a.length?a.map(card).join(''):'<div class="panel" style="text-align:center"><p class="muted">مفيش طلبات جارية دلوقتي</p></div>'}<div class="sectionhead">الطلبات السابقة</div>${d.length?d.map(card).join(''):'<div class="panel"><p class="muted">الطلبات اللي اتسلمت هتظهر هنا.</p></div>'}`}
/* ربط الصفحات بالمنظومة الحالية */
const _pd=pageData;pageData=function(n){if(role==='عميل'){if(categories.includes(n))return storeCards(n);if(n==='سلة التسوق')return cartPage();if(n==='طلباتي')return ordersPage();if(n.startsWith('متجر:'))return storePage(n.slice(5));if(n.startsWith('تتبع:'))return trackPage(n.slice(5))}return _pd(n)};
const _sp=showPage;showPage=function(n){curPage=n;_sp(n);let t=null,b='الرئيسية';if(n.startsWith('متجر:')){const s=findStore(n.slice(5));t=s?s.name:'المتجر';b=s?s.cat:b}else if(n.startsWith('تتبع:')){t='تتبع الطلب';b='طلباتي'}if(t)document.getElementById('pageTitle').textContent=t;document.querySelector('#subpage .back').onclick=()=>showPage(b);if(n==='الرئيسية')homeOrder();saveCart()};
function homeOrder(){const o=activeOrders.find(x=>(x.stage||0)<3),el=document.querySelector('.order');if(!el)return;el.querySelector('h3').textContent=o?'طلبك الحالي':'طلبك الحالي';el.querySelectorAll('p')[0].textContent=o?`${o.title} · ${STEPS[o.stage||0][0]}`:'تابع حالة طلبك وتفاصيل التوصيل';el.querySelector('.route').textContent=o?'📍 اضغط لتتبع الطلب لحظة بلحظة':'📍 متابعة الطلبات الجارية';el.querySelector('.track').onclick=()=>showPage(o?'تتبع:'+o.id:'طلباتي')}
/* محاكاة تقدم الطلب (تجريبي لحد ما نربط المندوب) */

document.querySelector('.cartButton').insertAdjacentHTML('beforeend','<span class="badge" id="cartBadge" hidden>0</span>');
document.querySelector('.hero .dots').insertAdjacentHTML('beforebegin','');
saveCart();homeOrder();
</script>
<script>
/* ===== وضع المالك + قفل نوع الحساب ===== */
const OWNER_PIN='__disabled__'; /* ← غيّر الرمز ده قبل أي نشر. التحقق الحقيقي هيبقى من السيرفر لما نربط الباك إند */
const isOwner=()=>localStorage.getItem('etlobly_owner')==='1';
const _sr=setRole;setRole=function(r){_sr(r);ownerBarSync()};
const _lo=logout;logout=function(){if(isOwner()){localStorage.removeItem('etlobly_owner');_lo();ownerBarSync()}else{showPage('الرئيسية');notify('تم تسجيل الخروج من الجلسة')}};
const _pd2=pageData;pageData=function(n){if(n==='تبديل الواجهة'&&!isOwner())return '<div class="panel" style="text-align:center"><h3>🔒 نوع الحساب ثابت</h3><p class="muted">تم تحديد نوع حسابك عند التسجيل ولا يمكن تغييره.</p></div>';let h=_pd2(n);if(n==='المزيد'&&isOwner())h+=item('🗂️','إدارة الأماكن','إضافة وحذف المتاجر والأماكن (المالك)','إدارة الأماكن');return h};
const _sp2=showPage;showPage=function(n){if(n==='إدارة الأماكن'&&isOwner()){const r=role;role='إدارة';try{_sp2(n)}finally{role=r}}else _sp2(n)};
const bar=document.createElement('div');bar.id='ownerBar';bar.hidden=true;bar.innerHTML='<span class="tag">👑 المالك</span><div class="seg"><button data-r="عميل">عميل</button><button data-r="مندوب">مندوب</button></div><button class="out" title="خروج من وضع المالك" onclick="logout()">خروج</button>';
document.getElementById('topbar').after(bar);
bar.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{setRole(b.dataset.r)});
function ownerBarSync(){const o=isOwner();bar.hidden=!o;bar.style.top=(document.getElementById('topbar').offsetHeight)+'px';bar.querySelectorAll('.seg button').forEach(b=>b.classList.toggle('on',b.dataset.r===role))}
/* دخول المالك من شاشة الترحيب */
const wb=document.querySelector('.welcomeBox');
wb.insertAdjacentHTML('beforeend','<button class="ownerLink" id="ownerLink">دخول المالك</button><div class="ownerPin" id="ownerPin"><input id="ownerPinIn" type="password" inputmode="numeric" maxlength="8" placeholder="••••" aria-label="رمز المالك"><button id="ownerPinGo">دخول</button></div><div class="ownerErr" id="ownerErr"></div>');
document.getElementById('ownerLink').onclick=()=>{document.getElementById('ownerPin').classList.toggle('show');document.getElementById('ownerPinIn').focus()};
function ownerGo(){const v=document.getElementById('ownerPinIn');if(v.value===OWNER_PIN){localStorage.setItem('etlobly_owner','1');v.value='';document.getElementById('ownerErr').textContent='';document.getElementById('ownerPin').classList.remove('show');setRole(localStorage.getItem('etlobly_role')||'عميل')}else{document.getElementById('ownerErr').textContent='الرمز غير صحيح';v.value=''}}
document.getElementById('ownerPinGo').onclick=ownerGo;document.getElementById('ownerPinIn').onkeydown=e=>{if(e.key==='Enter')ownerGo()};
ownerBarSync();
</script>
<script>
/* ===== مدخل المالك: يشتغل من أي شاشة (حتى لو نوع الحساب محفوظ) ===== */
const om=document.createElement('div');om.id='ownerModal';om.hidden=true;
om.innerHTML='<div class="box"><div style="font-size:34px">👑</div><h3>دخول المالك</h3><p>اكتب رمز المالك للمتابعة</p><input id="omIn" type="password" inputmode="numeric" maxlength="8" placeholder="••••"><div class="err" id="omErr"></div><div class="row"><button class="no" id="omNo">إلغاء</button><button class="go" id="omGo">دخول</button></div></div>';
document.body.appendChild(om);
function openOwner(){om.hidden=false;document.getElementById('omErr').textContent='';const i=document.getElementById('omIn');i.value='';setTimeout(()=>i.focus(),50)}
function omSubmit(){const i=document.getElementById('omIn');if(i.value===OWNER_PIN){localStorage.setItem('etlobly_owner','1');om.hidden=true;const r=localStorage.getItem('etlobly_role')||'عميل';setRole(r);notify('أهلاً بيك يا مالك 👑')}else{document.getElementById('omErr').textContent='الرمز غير صحيح';i.value=''}}
document.getElementById('omGo').onclick=omSubmit;document.getElementById('omNo').onclick=()=>om.hidden=true;document.getElementById('omIn').onkeydown=e=>{if(e.key==='Enter')omSubmit()};
document.getElementById('ownerLink').onclick=openOwner;
/* اضغط على شعار "اطلبلى" 5 مرات بسرعة → يفتح دخول المالك */
let taps=[];document.querySelector('.brand').addEventListener('click',()=>{const t=Date.now();taps=taps.filter(x=>t-x<3000);taps.push(t);if(taps.length>=5){taps=[];openOwner()}});
/* روابط مساعدة للتجربة: ‎#owner‎ يفتح دخول المالك، و ‎#reset‎ يمسح الاختيار المحفوظ ويرجّع شاشة الترحيب */
function hashCmd(){const h=location.hash;if(h==='#reset'){localStorage.removeItem('etlobly_role');localStorage.removeItem('etlobly_owner');history.replaceState(null,'',location.pathname+location.search);location.reload()}else if(h==='#owner'){history.replaceState(null,'',location.pathname+location.search);openOwner()}}
window.addEventListener('hashchange',hashCmd);hashCmd();
</script>

placeOrder=function(){const a=document.getElementById('oAddr').value.trim();if(!a){notify('اكتب عنوان التوصيل الأول');document.getElementById('oAddr').focus();return}localStorage.setItem('etlobly_addr',a);const s=findStore(cart.sid),sub=cartSub(),id='ET'+Math.floor(10000+Math.random()*89999);loadOrders();activeOrders.unshift({id,v:5,title:s.name,icon:s.icon,from:s.name,to:(typeof area!=='undefined'&&area?area+' — ':'')+a,stage:0,status:ST[0][0],total:sub+FEE,fee:FEE,pay,note:document.getElementById('oNote').value,items:Object.values(cart.items).map(i=>({n:i.name,q:i.q,p:i.price})),t:Date.now()});saveOrders();lastSeen[id]=0;cart={sid:null,items:{}};saveCart();notify('تم إرسال طلبك ✓ في انتظار قبول مندوب');showPage('تتبع:'+id)};

<div id="stepCode" hidden><input id="authCode" class="fld" inputmode="numeric" maxlength="6" placeholder="كود من 6 أرقام" style="text-align:center;font-size:20px;letter-spacing:6px"><button id="verifyCode" class="bigbtn">تأكيد</button></div>
<p id="authMsg" style="color:#ff6900;font:700 13px 'Cairo';min-height:20px;margin-top:12px">جاري التحميل…</p>
<div id="recap"></div></div></div>
<script>
window.showErr=function(t){var b=document.getElementById('errBanner');if(!b){b=document.createElement('div');b.id='errBanner';b.style.cssText='position:fixed;bottom:0;left:0;right:0;z-index:9000;background:#16181d;color:#fff;font:600 12px Arial,sans-serif;padding:8px 12px;direction:ltr;text-align:left;max-height:26vh;overflow:auto';b.onclick=function(){b.remove()};document.body.appendChild(b)}b.textContent='⚠ '+t+'  (اضغط للإغلاق)'};
window.addEventListener('error',function(e){showErr(e.message)});
window.addEventListener('unhandledrejection',function(e){showErr((e.reason&&(e.reason.code||e.reason.message))||'خطأ')});
</script>
<script>
const _srA=setRole;setRole=function(r){_srA(r);if(window.__onRole)window.__onRole(r)};
const _loA=logout;logout=function(){_loA();if(window.__signOut)window.__signOut()};
openOwner=function(){};
setTimeout(()=>{if(!window.__authReady)document.getElementById('authMsg').textContent='تأكد من اتصال الإنترنت'},7000);
</script>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,RecaptchaVerifier,signInWithPhoneNumber,onAuthStateChanged,signOut} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,getDoc,setDoc,serverTimestamp,collection,query,where,onSnapshot,writeBatch,updateDoc,deleteDoc,runTransaction} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyD4VGg4-vMivTNWy05OD8npSDJV57l0TK4",authDomain:"etlobly-18ca1.firebaseapp.com",projectId:"etlobly-18ca1",storageBucket:"etlobly-18ca1.firebasestorage.app",messagingSenderId:"329992721589",appId:"1:329992721589:web:5cc888dc802aafa89d5afc"});
const auth=getAuth(app);auth.languageCode='ar';const db=getFirestore(app);
const $=id=>document.getElementById(id),msg=t=>$('authMsg').textContent=t;let conf=null,ver=null;
const e164=v=>{v=v.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/\D/g,'');return /^01[0125]\d{8}$/.test(v)?'+2'+v:null};
$('sendCode').onclick=async()=>{const p=e164($('authPhone').value);if(!p)return msg('رقم التليفون غير صحيح');msg('جاري إرسال الكود…');try{ver=ver||new RecaptchaVerifier(auth,'recap',{size:'invisible'});conf=await signInWithPhoneNumber(auth,p,ver);$('stepPhone').hidden=true;$('stepCode').hidden=false;msg('')}catch(e){msg('تعذّر الإرسال ('+(e.code||'خطأ')+')');try{ver.clear()}catch(_){}ver=null}};
$('verifyCode').onclick=async()=>{try{await conf.confirm($('authCode').value.trim());msg('')}catch(e){msg('الكود غير صحيح')}};
window.__signOut=()=>signOut(auth);
window.__onRole=async r=>{if(!window.__uid)return;try{if(!window.__hasDoc&&!isOwner()){await setDoc(doc(db,'users',window.__uid),{role:r,phone:window.__phone,createdAt:serverTimestamp()});window.__hasDoc=true}}catch(e){notify('تعذّر حفظ نوع الحساب');showErr('حفظ الحساب: '+(e.code||e.message))}listen(r)};

/* ===== مزامنة الطلبات مع Firestore ===== */
let unsubs=[],listenRole=null;const shadow=new Map();
const sig=o=>JSON.stringify([o.stage,o.paidWith||null,o.recvAmt??null,o.wallet??null,o.done||null,!!o.received,o.courierUid||null]);
const pub=o=>({title:o.title,icon:o.icon||'',from:o.from,total:o.total,fee:o.fee||15,pay:o.pay,count:o.items.reduce((a,i)=>a+i.q,0),stage:o.stage,status:o.status||'',custUid:o.custUid,courierUid:null,sLat:o.sLat??null,sLng:o.sLng??null,t:o.t,received:false});
const toLocal=(id,d,old)=>{const o={...(old||{}),id,v:5,title:d.title,icon:d.icon,from:d.from,total:d.total,fee:d.fee,pay:d.pay,stage:d.stage,status:d.status,t:d.t,received:!!d.received,paidWith:d.paidWith,recvAmt:d.recvAmt,wallet:d.wallet,done:d.done,custUid:d.custUid,courierUid:d.courierUid||null,courier:d.courierUid?'مندوب':undefined,sLat:d.sLat,sLng:d.sLng};if(!o.priv){o.items=[{q:d.count,n:'',p:0}];o.to=o.to||'';o.note=o.note||'';o.dist=null}return o};
function refreshUI(){if(role==='عميل')activeOrders.forEach(o=>{if(lastSeen[o.id]!==undefined&&o.stage>lastSeen[o.id])notify('#'+o.id+': '+ST[o.stage][0])});activeOrders.forEach(o=>lastSeen[o.id]=o.stage);if(!sub.hidden&&/^(تتبع:|طلباتي|مهمة:|طلبات المندوب|أرباحي|طلبات اليوم)/.test(curPage))rerender();if(!courierHome.hidden)renderCourier();homeOrder();navBadges()}
async function fetchPriv(o){if(o.priv||!(o.custUid===window.__uid||o.courierUid===window.__uid))return;try{const s=await getDoc(doc(db,'orders',o.id,'private','d'));const x=activeOrders.find(y=>y.id===o.id);if(s.exists()&&x){Object.assign(x,s.data(),{priv:true});refreshUI()}}catch(e){}}
function onSnap(snap){snap.docChanges().forEach(ch=>{const id=ch.doc.id;const i=activeOrders.findIndex(o=>o.id===id);if(ch.type==='removed'){const c=i>=0?activeOrders[i]:null;if(c&&c.courierUid&&c.courierUid===window.__uid)return;if(i>=0)activeOrders.splice(i,1);shadow.delete(id);return}const o=toLocal(id,ch.doc.data(),i>=0?activeOrders[i]:null);if(i>=0)activeOrders[i]=o;else activeOrders.push(o);shadow.set(id,sig(o));fetchPriv(o)});refreshUI()}
function listen(r){if(!window.__uid||listenRole===r)return;unsubs.forEach(f=>f());unsubs=[];activeOrders.length=0;shadow.clear();listenRole=r;const oc=collection(db,'orders'),er=e=>{showErr('تحميل الطلبات: '+(e.code||e.message));if(listenRole===r){listenRole=null;setTimeout(()=>listen(r),3000)}};if(r==='عميل')unsubs.push(onSnapshot(query(oc,where('custUid','==',window.__uid)),onSnap,er));else{unsubs.push(onSnapshot(query(oc,where('stage','==',0)),onSnap,er));unsubs.push(onSnapshot(query(oc,where('courierUid','==',window.__uid)),onSnap,er))}refreshUI()}
let syncing=false,again=false;
window.__sync=async()=>{if(!window.__uid)return;if(syncing){again=true;return}syncing=true;try{for(const o of [...activeOrders]){const sh=shadow.get(o.id);
if(sh===undefined){if(o.custUid||role==='مندوب')continue;o.custUid=window.__uid;const b=writeBatch(db);b.set(doc(db,'orders',o.id),{...pub(o),created:serverTimestamp()});b.set(doc(db,'orders',o.id,'private','d'),{to:o.to,note:o.note||'',items:o.items,cLat:o.cLat??null,cLng:o.cLng??null,cGps:!!o.cGps,dist:o.dist??null});o.priv=true;shadow.set(o.id,sig(o));try{await b.commit()}catch(e){shadow.delete(o.id);activeOrders.splice(activeOrders.indexOf(o),1);notify('تعذّر إرسال الطلب');refreshUI()}continue}
const now=sig(o);if(now===sh)continue;const ref=doc(db,'orders',o.id);
try{if(role==='مندوب'||(isOwner()&&role!=='عميل')){if(JSON.parse(sh)[0]===0&&o.stage===1){await runTransaction(db,async t=>{const sn=await t.get(ref);if(!sn.exists()||sn.data().stage!==0||sn.data().courierUid)throw new Error('taken');t.update(ref,{stage:1,status:o.status||'',courierUid:window.__uid})});o.courierUid=window.__uid;o.courier='مندوب'}else{const u={stage:o.stage,status:o.status||''};if(o.paidWith)u.paidWith=o.paidWith;if(o.recvAmt!=null)u.recvAmt=o.recvAmt;if(o.wallet!=null)u.wallet=o.wallet;if(o.done)u.done=o.done;await updateDoc(ref,u)}}
else if(o.received){await updateDoc(ref,{received:true})}
shadow.set(o.id,sig(o))}catch(e){if(String(e.message).includes('taken')){notify('الطلب ده اتاخد من مندوب تاني');o.stage=0;o.courier=undefined;o.courierUid=null;shadow.set(o.id,sig(o))}else{notify('تعذّرت المزامنة');console.error(e)}refreshUI()}}
for(const id of [...shadow.keys()]){if(!activeOrders.some(o=>o.id===id)&&role==='عميل'){shadow.delete(id);try{await deleteDoc(doc(db,'orders',id))}catch(e){}}}}finally{syncing=false;if(again){again=false;window.__sync()}}};
onAuthStateChanged(auth,async u=>{window.__authReady=true;if(!u){unsubs.forEach(f=>f());unsubs=[];listenRole=null;shadow.clear();activeOrders.length=0;window.__uid=null;window.__hasDoc=false;$('stepPhone').hidden=false;$('stepCode').hidden=true;msg('');$('authScreen').hidden=false;return}
window.__uid=u.uid;window.__phone=u.phoneNumber;activeOrders.length=0;localStorage.removeItem('etlobly_active_orders');
try{const s=await getDoc(doc(db,'users',u.uid));if(s.exists()){const d=s.data();window.__hasDoc=true;if(d.isOwner===true)localStorage.setItem('etlobly_owner','1');else localStorage.removeItem('etlobly_owner');localStorage.setItem('etlobly_role',d.role);setRole(d.role);listen(d.role)}else{localStorage.removeItem('etlobly_owner');window.__hasDoc=false}}catch(e){msg('تعذّر قراءة حسابك');return}
ownerBarSync();$('authScreen').hidden=true});
</script>
</body></html>
